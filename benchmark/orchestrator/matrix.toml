# Benchmark matrix: cells = model x task x level x rep.
# Tasks default to the ready set (benchmark/tasks/*.yaml with status: ready).

[run]
seed = 20261028            # shuffles cell order; recorded in the manifest
reps = 3                   # use --reps 1 for the first pass
agent_timeout_s = 1800
grade_slots = 3            # concurrent Docker evaluations
levels = ["none", "agents", "skills", "full"]
sandbox = "docker"         # "docker" (only the tree is mounted) | "none" (host shell; contamination detector only)
sandbox_image = "pf-bench-agent:tcc-baseline-v1"
prompt_preamble = "prompt-preamble.md"   # put before every statement ("work without asking"); "" = none
max_attempts = 3           # infra retries per stage before failed_infra (429s do not count)
rate_limit_base_s = 60     # first pool pause on a 429; doubles per consecutive 429...
rate_limit_max_s = 1800    # ...up to this; retried until the usage window reopens

[[model]]
id = "opencode-go/glm-5.3-flash"
runner = "opencode"
pool = "opencode-go"
trains_on_data = false

[[model]]
id = "opencode-go/deepseek-v4.1-flash"
runner = "opencode"
pool = "opencode-go"
trains_on_data = false

[[model]]
id = "opencode-go/mimo-v2.6-flash"
runner = "opencode"
pool = "opencode-go"
trains_on_data = false

[[model]]
# Trains on submitted data. Allowed without --allow-training-models by decision of
# the author (the subject code was written with this model; see NOTES.md).
id = "opencode-go/muse-spark-1.3-contributor"
runner = "opencode"
pool = "opencode-go"
trains_on_data = true
training_ok = true

[[model]]
# Anthropic models run only through Claude Code (NOTES.md, decision 3).
id = "claude-haiku-5-5"
runner = "claude-code"
pool = "anthropic"
effort = "high"            # pinned: the CLI default may change between Claude Code versions

[[model]]
id = "claude-sonnet-5-5"   # "scale" arm: full matrix, all four levels
runner = "claude-code"
pool = "anthropic"
effort = "high"            # pinned, as above

[[model]]
# Previous-generation small model: the most likely to sit below the ceiling on these tasks.
id = "claude-haiku-4-5"
runner = "claude-code"
pool = "anthropic"
# no effort: Haiku 4.5 has no effort levels

[[model]]
# Top-of-scale reference, extremes only (likely at ceiling; add "agents"/"skills" later if
# needed: new cells, nothing to redo).
id = "claude-opus-5-5"
runner = "claude-code"
pool = "anthropic"
effort = "medium"
levels = ["none", "full"]

[[model]]
# Free on OpenCode Go ("Limited Time": may leave the catalogue mid-matrix; check with
# `opencode models`). Data not used for training, 30-day retention. Own pool so its rate
# limits never pause the paid models.
id = "opencode-go/beam-free"
runner = "opencode"
pool = "opencode-go-free"
trains_on_data = false
# 2026-10-29 07:15: the OpenCode Go endpoint had been down since 01:12; the same model served
# free by OpenCode Zen answers. The remaining cells of reduced run 1 are served by Zen and kept
# under this model (author's decision); each run records `served_as`. Zen's data policy was
# not verified; sending the subject code was accepted by the author.
serve_as = "opencode/beam-free"

[[model]]
# Local open-weight models through OpenCode, served by llama-server on the experimenter's GPU
# (start orchestrator/llama/serve.sh first). Runner parameters are in llama/models.ini:
# context (128k gpt-oss, 64k Qwen), one slot, f16 KV, ngram-mod speculative decoding
# (lossless). Own pool, one run at a time: a single 16 GB GPU holds one model, the router
# swaps them between runs.
id = "llama/gpt-oss-20b"   # gpt-oss-20b MXFP4, reasoning effort medium
runner = "opencode"
pool = "llama"

[[model]]
id = "llama/qwen3.6-35b-a3b"   # Qwen3.6-35B-A3B UD-IQ3_S (3-bit, to fit in VRAM)
runner = "opencode"
pool = "llama"

# Pipeline validation agents (not part of the experiment; select with --models).
[[model]]
id = "oracle"
runner = "oracle"
pool = "local"
validation = true

[[model]]
id = "null"
runner = "null"
pool = "local"
validation = true

[pool.opencode-go]
max_concurrency = 3
[pool.opencode-go-free]
max_concurrency = 3
[pool.anthropic]
max_concurrency = 3
[pool.llama]
max_concurrency = 1
[pool.local]
max_concurrency = 4
