; llama-server router presets for the local models (orchestrator/llama/serve.sh).
; Section names are the model ids the router serves; matrix.toml uses them as
; "llama/<section>". Paths are relative to $MODELS_DIR (serve.sh cds into it).
;
; Shared: one slot, f16 KV cache, ngram-mod speculative decoding (lossless: same
; output distribution, only faster). Context: the largest that fits in the 16 GB
; VRAM next to each model's weights (128k gpt-oss, 64k Qwen), set per model.
version = 1

[*]
parallel = 1
n-gpu-layers = all
flash-attn = auto
jinja = true
spec-type = ngram-mod
; one model in VRAM at a time (RX 9070 16 GB): the router swaps on demand
stop-timeout = 10

[gpt-oss-20b]
model = gpt-oss-20b-MXFP4.gguf
c = 131072
; OpenAI's recommended sampling; reasoning effort pinned to the template default
temp = 1.0
top-p = 1.0
reasoning-effort = medium

[qwen3.6-35b-a3b]
model = Qwen3.6-35B-A3B-UD-IQ3_S.gguf
c = 65536
; Qwen's recommended sampling for thinking mode
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0.0
