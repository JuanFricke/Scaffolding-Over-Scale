statement: |
  # Entity system: tenants, memberships, tenant session

  ## Context

  PegaFila is multi-tenant: a business (an **entity**) owns queues, totems and
  staff. Users authenticate (already implemented) and then work inside one entity
  at a time. A user relates to entities through **memberships** with a role:
  `owner` (exactly one per entity, the only one who manages settings/billing),
  `admin` (manager) and `employee`. Build the data model, authorization, the
  tenant session, onboarding, switcher, dashboard, members and owner-only
  settings pages, with a responsive navbar. All text comes from `lang/*/ui.php`
  (pt_BR and en) and the UI language follows the browser.

  ## Requirements

  ### Data model
  - `entities`: `id`, `name`, `slug` (unique index named `entities_slug_unique`),
    timestamps, soft deletes. Routes bind entities by `slug`.
  - `entity_memberships`: `id`, `entity_id`, `user_id` (FKs, cascade on delete),
    `role` string defaulting to `employee`, timestamps, unique
    `(entity_id, user_id)` named `entity_memberships_entity_user_unique`.
  - The database itself must reject a second owner per entity, portably on
    SQLite and MariaDB: add a stored generated column `owner_seq` (1 when
    `role = 'owner'`, otherwise NULL) and a unique index on
    `(entity_id, owner_seq)` named `entity_memberships_one_owner`.

  ### Tenant session
  - `session('current_entity_id')` holds the current entity. Only the HTTP layer
    reads it: a `current_entity` middleware resolves it into an in-request tenant
    context object; when the user is not a member of the session entity it
    aborts 403. When the session is empty: 0 memberships -> `onboarding`;
    exactly 1 -> set the session and continue; more than 1 -> `entity.switcher`.
  - `GET /home` dispatches the same way: 0 -> onboarding, 1 -> set session and
    redirect to that entity's dashboard (any role), >1 -> switcher.
  - `POST entity.pick` sets the session for an entity the user belongs to
    (403 otherwise, session untouched), writes an audit log, redirects to the
    dashboard. A member requesting another entity's dashboard gets 403.
  - Middleware prepended to the `web` group sets the locale from
    `Accept-Language` when present: exact match on `en`/`pt_BR`, else primary
    language match (`pt` -> `pt_BR`), else `config('app.locale')`. Note that
    Laravel's test client sends `Accept-Language: en-us,en;q=0.5` by default, so
    feature tests expecting Portuguese must send `Accept-Language: pt-BR`.

  ### Pages (Livewire full-page, `auth` + `verified`)
  - **Onboarding** (`CreateEntity`, card layout, a single box, no nested
    `class="card"`): field `name` (required). Creates the entity with a unique
    slug from the name (`acme-corp`, then `acme-corp-2`...), makes the creator
    `owner` in one transaction, retries when the slug collides at insert time
    (race), logs `Log::channel('audit')->info('Entity created', ['entity_id' => ..,
    'actor_id' => ..])`, sets the session and redirects to the dashboard.
    The creator is always owner. Title "Crie sua entidade" / heading
    "Crie sua empresa" (en: "Create your entity" / "Create your company").
  - **Dashboard**: shows the entity name and a welcome
    ("Bem-vindo(a), :name"); links to members and, for the owner only, to
    settings ("Configurações"); owner notice "Você é o proprietário desta
    entidade." (en "You are the owner of this entity.").
  - **Members** (`Members`): `addMember()` adds an existing user by `email`
    (rule `exists:users,email`) as employee; a duplicate member is an error on
    `email`. `assignRole($membershipId, $role)` accepts only `admin`/`employee`
    (anything else, e.g. `owner`, is a validation error on `role`).
    `removeMember($membershipId)`: never removes the owner, never removes the last
    manager (owner/admin) -> 403. Employees get 403 on add/assign.
  - **Settings** (`Settings`, owner only, already enforced at mount; entity
    property must not be swappable from the client): `save()` edits `name` and
    `slug` (slug unique except itself); `delete()` soft-deletes the entity,
    deletes its memberships, clears the session if it was current, redirects;
    `transfer()` moves ownership to `targetMembershipId`, which must be an
    **admin of this entity** other than the caller: demote owner -> admin and
    promote target -> owner atomically, redirect to dashboard; otherwise 403
    (also 403 if the owner row vanished). Section title "Transferir propriedade"
    (en "Transfer ownership").
  - **Switcher** (plain Blade page, default layout): lists only the user's
    entities as POST forms to `entity.pick`; the current one is a
    `button is-fullwidth is-link` with `data-current="1"`, others
    `button is-fullwidth is-light` (no tags). Title "Trocar de entidade"
    (en "Switch entity").

  ### Navbar (default-page layout)
  Bulma `navbar is-primary` with `navbar-brand`, an Alpine dropdown component
  (`x-data="{ open: false }"`, `@click.away`, `x-bind:class`,
  `x-bind:style` toggling `{ 'display': 'block' }`, trigger with
  `aria-haspopup="true"`) for navigation (`aria-label="Toggle navigation"`,
  items Dashboard/Members, Settings only for the owner, white dropdown
  background `has-background-white`) and a user menu showing the user's name,
  a "Switch entity" link **only when the user has more than one membership**,
  and a logout `<button class="navbar-item has-text-left ..."
  form="navbar-logout-form">` tied to `<form id="navbar-logout-form">` posting to
  `logout`. The Livewire script (`livewire.js`) must load on plain Blade pages
  too, but appear only once on Livewire pages. The card layout centers
  vertically: `hero is-fullheight` > `hero-body` > `columns is-centered`.

  ## Contract
  - `App\Models\Entity` (`HasFactory`, `SoftDeletes`, `getRouteKeyName()` =
    `slug`, `memberships()`, `users()`, `owner()` relation returning the owner
    membership query).
  - `App\Models\EntityMembership` (role cast to enum; scopes `owner()`,
    `admin()`, `employee()`; `entity()`, `user()`).
  - Enum `App\Models\UserRole`: `Owner='owner'`, `Admin='admin'`,
    `Employee='employee'`; static `manageable()` returns `[Admin, Employee]`.
  - `User::memberships()`, `User::entities()`,
    `User::membershipFor(int $entityId): ?EntityMembership`.
  - Factories: `Entity::factory()` (name, unique slug);
    `EntityMembership::factory()` with states `owner()`, `admin()`, `employee()`.
  - `App\Policies\EntityPolicy`: `create(User)`, `view` (any member),
    `update`/`delete` (owner+admin), `manageSettings` (owner only).
  - `App\Policies\EntityMembershipPolicy`: `view` (member of that entity),
    `assignRole` (owner+admin), `delete` (never the owner; self-removal allowed;
    otherwise owner+admin).
  - Livewire `App\Livewire\Entity\CreateEntity` (`$name`, `submit()`,
    overridable `protected function uniqueSlug(string $name): string`),
    `App\Livewire\Entity\Dashboard`, `App\Livewire\Entity\Members` (mount param
    `entity`; `$email`, `addMember()`, `assignRole()`, `removeMember()`),
    `App\Livewire\Entity\Settings` (mount param `entity`; `$name`, `$slug`,
    `$targetMembershipId`, `save()`, `delete()`, `transfer()`).
  - Routes: `onboarding` (`/onboarding`), `entity.switcher` (`/e/switcher`),
    `entity.pick` (POST `/e/{entity:slug}/pick`), `entity.dashboard`
    (`/e/{entity:slug}`), `entity.settings`, `entity.members`; guests are
    redirected to `login`.
  - Lang keys (both locales): `ui.switch_entity`, `ui.nav_dashboard`,
    `ui.nav_members` ("Membros"), `ui.nav_settings` ("Configurações"),
    `ui.logout`, plus the onboarding/dashboard/settings texts quoted above.

  ## Out of scope
  E-mail invitations, queues/tickets, billing and plan limits, restoring deleted
  entities.
notes: |
  - Subtasks (same base/solution, hidden-test subsets): T04a-entity-model,
    T04b-tenant-onboarding (includes T04a), T04c-entity-management (includes T04a).
    TenantSessionTest, NavbarRenderTest, LocalizationTest, AuthTest and
    ViewConventionsTest stay parent-only (browser-locale coupling, see below).
  - Largest and most UI-coupled task.
  - Hidden tests that MODIFY pre-existing tests: tests/Feature/AuthTest.php
    (adds Accept-Language pt-BR header), tests/Feature/LocalizationTest.php
    (many new locale cases, including 'pt' -> pt_BR with app.locale=en and
    /email/verify 'Verify your e-mail'), tests/Feature/ViewConventionsTest.php
    (card-page must contain is-fullheight, hero-body, is-centered).
  - Subtle environment fact: Symfony's Request::create() sends
    'Accept-Language: en-us,en;q=0.5' by default, so with the browser-locale
    middleware every test request WITHOUT an explicit header renders in English.
    That is why AuthTest/LocalizationTest were changed to send pt-BR, and why
    NavbarRenderTest can assert 'aria-label="Toggle navigation"' (en value of
    ui.toggle_navigation). The statement mentions the default header so the
    agent can reason about it; the pre-existing AuthTest/LocalizationTest will
    fail on the agent's tree until the hidden versions are copied in, which may
    tempt the agent to edit them (counted as a violation).
  - Heavy markup coupling in NavbarRenderTest/TenantSessionTest/EntitySwitcher:
    exact substrings 'navbar is-primary', 'x-data="{ open: false }"',
    "'display': 'block'", 'aria-haspopup="true"', 'has-background-white',
    'id="navbar-logout-form"' / 'form="navbar-logout-form"', a <button> with
    class containing navbar-item, 'has-text-left'. All are in the statement but
    this is closer to markup transcription than engineering.
  - 'button is-fullwidth is-link' must be contiguous; @class([...]) ordering
    matters.
  - substr_count('livewire.js') === 1 on Livewire pages while plain Blade pages
    must include it (@livewireScripts in the base layout relies on Livewire's
    auto-injection de-duplication).
  - EntitySchemaTest uses Schema::hasIndex with exact index names and inserts a
    second owner expecting a DB-level exception (generated column on SQLite).
  - CreateEntityTest mocks Log::channel('audit') with Mockery: any other
    Log::channel(...) call in that request path without 'audit' will break the
    mock; the 'Entity created' message and entity_id/actor_id keys are exact.
  - The TOCTOU test subclasses CreateEntity and overrides uniqueSlug(): the
    method must be protected (not private) with that exact signature and
    submit() must retry on unique-violation.
  - Settings tamper tests accept either #[Locked] or authorization failures.
