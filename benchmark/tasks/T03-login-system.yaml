statement: |
  # User authentication for PegaFila (pt-BR first)

  ## Context

  PegaFila has no authentication yet: only a welcome page and a Bulma test page.
  Before entities, queues and tickets can exist we need staff accounts. Build the
  full session-based auth flow with Livewire 4 full-page components and Bulma,
  with the product speaking **Brazilian Portuguese** by default (English as the
  fallback), and harden it against the usual attacks. Do not install a starter
  kit (Breeze/Fortify/Jetstream); write it in the app.

  ## Functional requirements

  1. **Login** (Livewire full-page, guests only): e-mail + password + "remember
     me". Validate e-mail strictly. Wrong credentials raise a validation error on
     `email` with the message `__('auth.failed')` (pt-BR: "Essas credenciais não
     correspondem..."). Rate limit failed attempts per lowercase e-mail + IP (5
     tries); when locked, error on `email` using `auth.throttle`. On success
     regenerate the session and redirect (intended) to `home`.
  2. **Register** (Livewire full-page, guests only): name, e-mail (strict, unique),
     password + confirmation. Passwords follow the app-wide default rule:
     min 8, letters, mixed case, numbers (configure it once via
     `Password::defaults()`). A mismatched confirmation fails with the `confirmed`
     rule on `password`. Rate limit by IP with key
     `str()->transliterate('register|'.$ip)` and 5 attempts; when the limiter is
     exhausted, error on `email`. On success create the user (unverified), fire
     `Registered` (sends the verification mail), log in, regenerate the session,
     redirect to `home`.
  3. **Logout**: POST, authenticated only, invalidates the session and
     regenerates the CSRF token, redirects to `login`.
  4. **Home** (`/home`): requires `auth` + `verified`. Guests go to `login`;
     unverified users go to `verification.notice`. Authenticated users visiting
     `login` are redirected to `home`.
  5. **Forgot password**: form + POST that always answers with a `status` flash
     (never reveal whether the e-mail exists), throttled at 6 requests/minute
     (7th request gets 429). Sends Laravel's `ResetPassword` notification when
     the user exists.
  6. **Reset password**: form (asks for the e-mail exactly once, i.e. a single
     `name="email"` input in the view) + POST; validates token, e-mail and the
     default password rule; on success saves the new password, **rotates
     `remember_token`**, fires `PasswordReset`, redirects to `login` with status.
  7. **E-mail verification**: `User` must implement `MustVerifyEmail`. Notice page;
     signed + throttled verification link that only verifies the logged-in user
     (a link whose id was tampered with returns 403 and verifies nobody), then
     redirects to `home`; a "resend" POST (throttled) that sends `VerifyEmail` and
     flashes `status`, but for an already verified user sends nothing and redirects
     to `home`.
  8. **Localization**: `.env.example` ships `APP_NAME=PegaFila`,
     `APP_LOCALE=pt_BR`, `APP_FALLBACK_LOCALE=en`. All screen text comes from
     translation files (new `lang/en/ui.php` and `lang/pt_BR/ui.php`), never
     hardcoded. With locale `pt_BR` the login page shows "Entrar", "Senha" and
     "Esqueceu a senha?"; with locale `en` it shows "Log in" and no Portuguese.
     Add pt-BR JSON translations for Laravel's notification subjects:
     "Reset your password" -> "Redefina sua senha" and "Verify your email address"
     -> "Verifique seu endereço de e-mail".
  9. **Mail theme**: markdown mail uses a custom theme `pegafila`
     (`resources/views/vendor/mail/html/themes/pegafila.css`) with the brand
     primary color `#0f7490` (used e.g. on the action button so it gets inlined);
     the reset mail rendered in pt-BR has the PegaFila name, "Olá!" greeting,
     "Redefinir senha" button and the translated sub-copy.
  10. **Layouts**: page layouts are anonymous Blade components (use `$slot`, never
      `@yield`/`@section`/`@extends`): `layouts/app.blade.php` (base HTML shell)
      and two children `layouts/card-page.blade.php` (centered card, used by auth
      screens) and `layouts/default-page.blade.php`. Livewire components use them
      via `#[Layout('layouts::card-page')]`; plain Blade views use
      `<x-layouts::...>` (register the `layouts` anonymous component namespace).
  11. **Conventions**: views link with `route()`, never hardcoded `href="/..."` /
      `action="/..."` (this includes the existing welcome/bulma pages); controllers
      and Livewire auth classes redirect with named routes. Inputs bind with plain
      `wire:model="field"`.
  12. **Infrastructure**: Livewire 4 serves its endpoints under
      `/livewire-<hash>`, so the nginx rule `location ^~ /livewire/` never matches.
      Change it to `location ^~ /livewire ` (open-ended prefix) in both
      `docker/nginx/default.conf` and the inline nginx config of
      `docker/compose.vps.yml`. Do not add the unrelated npm package `livewire`.
  13. **Test isolation**: the suite must always run with `APP_ENV=testing`, SQLite
      `:memory:` and the `array` mailer, even when the container exports
      `APP_ENV`/`DB_*`; switch the `phpunit.xml` entries to
      `<server ... force="true"/>` and pin `APP_NAME=PegaFila`, `APP_LOCALE=pt_BR`,
      `APP_FALLBACK_LOCALE=en` there.

  ## Contract

  - Routes (names and methods): `login` (GET `/login`, Livewire), `register`
    (GET `/register`, Livewire), `logout` (POST), `home` (GET `/home`),
    `password.request` (GET `/forgot-password`), `password.email` (POST
    `/forgot-password`, `throttle:6,1`), `password.reset` (GET
    `/reset-password/{token}`), `password.update` (POST `/reset-password`),
    `verification.notice` (GET `/email/verify`), `verification.verify` (GET
    `/email/verify/{id}/{hash}`, `signed`), `verification.send` (POST).
  - `App\Livewire\Auth\Login`: public `string $email`, `string $password`,
    `bool $remember`; method `submit()`; view `livewire.auth.login`.
  - `App\Livewire\Auth\Register`: public `string $name`, `string $email`,
    `string $password`, `string $password_confirmation`; method `submit()`;
    view `livewire.auth.register`.
  - Controllers under `app/Http/Controllers` (password reset, logout) and
    `app/Http/Controllers/Auth` (verification); any class names.
  - Views: `resources/views/auth/forgot-password.blade.php`,
    `resources/views/auth/reset-password.blade.php`,
    `resources/views/auth/verify-email.blade.php`, `resources/views/home.blade.php`,
    `resources/views/livewire/auth/{login,register}.blade.php`, the three layouts
    above.
  - Config: `mail.markdown.theme` = `pegafila`; `app.locale` = `pt_BR` in tests.
  - Lang: `auth.failed`, `auth.throttle`, `passwords.sent`, `ui.*` keys in both
    locales.

  ## Out of scope

  Entities/tenancy, roles, social login, 2FA, profile editing, an API.
notes: |
  - Subtasks (same base/solution, hidden-test subsets): T03a-auth-core (AuthTest,
    LocalizationTest, ViewConventionsTest), T03b-mail-theme (MailThemeTest).
    LivewireWiringTest, PfControllerTest, BulmaTest, TestEnvironmentTest stay parent-only.
  - Very broad PR: 44 non-test files, mixing auth, i18n, mail theming, Blade
    layout refactor, nginx/docker config and phpunit isolation. Recommended to
    split into subtasks (README already flags T03) or accept a low pass rate.
  - Hidden tests that MODIFY pre-existing tests: tests/Feature/BulmaTest.php
    (only drops an unused import), tests/Feature/PfControllerTest.php (now
    expects '^~ /livewire ' in docker/compose.vps.yml instead of '/livewire/').
  - Many tests are file-content assertions, not behavior: exact strings
    '^~ /livewire ' (with trailing space) in two docker files, layouts must
    contain '$slot' and not '@yield'/'@section', no @extends in
    resources/views/livewire/auth/*, substr_count('name="email"') === 1 in
    reset-password.blade.php, regex bans href="/x" across ALL views including
    pre-existing welcome.blade.php, 'wire:model="email"' literal (wire:model.live
    fails). All are stated in the statement.
  - Register rate-limit test pre-seeds RateLimiter with the exact key
    str()->transliterate('register|127.0.0.1') and 5 hits; any other key scheme
    fails. Stated in the contract.
  - MailThemeTest depends on Laravel 13 notification wording ('Reset your
    password', 'Verify your email address') and on pt_BR.json keys; '#0f7490'
    must survive CSS inlining (must style an element present in the mail).
  - LocalizationTest reads .env.example and config('app.locale'); grading copies
    .env.example to .env, so either the .env.example change or the phpunit.xml
    pin makes app.locale = pt_BR.
  - TestEnvironmentTest probably passes at base inside the grading container
    (no exported env); it guards a dev-machine problem.
  - Laravel's RedirectIfAuthenticated falls back to route('home') when it exists,
    so 'authenticated user visiting login redirects to home' needs the route name
    exactly 'home'.
