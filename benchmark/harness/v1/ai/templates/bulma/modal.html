<!-- Prefer the native <dialog> element when it fits. This is Bulma's modal
     for when you need its styling; it needs a few lines of JS to toggle. -->
<button class="button js-modal-open" data-target="exampleModal">Open modal</button>

<div id="exampleModal" class="modal">
  <div class="modal-background js-modal-close"></div>
  <div class="modal-card">
    <header class="modal-card-head">
      <p class="modal-card-title">Modal title</p>
      <button class="delete js-modal-close" aria-label="close"></button>
    </header>
    <section class="modal-card-body">Content.</section>
    <footer class="modal-card-foot">
      <button class="button is-success">Save</button>
      <button class="button js-modal-close">Cancel</button>
    </footer>
  </div>
</div>

<script>
  const openModal = (el) => { el.classList.add('is-active'); };
  const closeModal = (el) => { el.classList.remove('is-active'); };

  document.querySelectorAll('.js-modal-open').forEach((btn) => {
    btn.addEventListener('click', () => openModal(document.getElementById(btn.dataset.target)));
  });
  document.querySelectorAll('.js-modal-close').forEach((btn) => {
    btn.addEventListener('click', () => closeModal(btn.closest('.modal')));
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') document.querySelectorAll('.modal.is-active').forEach(closeModal);
  });
</script>
