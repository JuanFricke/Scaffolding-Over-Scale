<form method="post" action="/posts">
  <div class="field">
    <label class="label" for="title">Title</label>
    <div class="control">
      <input class="input" id="title" name="title" type="text" required maxlength="255">
    </div>
  </div>

  <div class="field">
    <label class="label" for="published_at">Publish date</label>
    <div class="control">
      <!-- Native picker: no JS date library needed. -->
      <input class="input" id="published_at" name="published_at" type="date">
    </div>
  </div>

  <div class="field">
    <label class="label" for="body">Body</label>
    <div class="control">
      <textarea class="textarea" id="body" name="body" required></textarea>
    </div>
  </div>

  <div class="field">
    <div class="control">
      <button class="button is-primary" type="submit">Save</button>
    </div>
  </div>
</form>
